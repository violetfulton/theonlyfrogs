name: Build and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    # Monday at 05:15 UTC
    - cron: "15 5 * * 1"

permissions:
  contents: read

concurrency:
  group: neocities-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # --------------------------------
      # SETUP
      # --------------------------------

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # --------------------------------
      # PRE-BUILD DATA
      # --------------------------------

      - name: Refresh Discogs
        continue-on-error: true
        env:
          DISCOGS_USERNAME: ${{ secrets.DISCOGS_USERNAME }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: npm run fetch:discogs
        
      # --------------------------------
      # BUILD
      # --------------------------------

      - name: Build Eleventy
        env:
          # Steam
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}

          # MyAnimeList
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_USERNAME: ${{ secrets.MAL_USERNAME }}

          # RetroAchievements
          RA_WEB_API_KEY: ${{ secrets.RA_WEB_API_KEY }}

          # Simkl
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}

          # TMDb
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

          # Pokémon shiny sheet
          SHINY_SHEET_CSV_URL: ${{ secrets.SHINY_SHEET_CSV_URL }}

          # Games
          GAMES_CSV_URL: ${{ secrets.GAMES_CSV_URL }}
          THEGAMESDB_OFFLINE: "1"

        run: npm run build

      # --------------------------------
      # DEPLOY
      # --------------------------------

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: public
          cleanup: true

      # --------------------------------
      # SUCCESS
      # --------------------------------

      - name: Build summary
        run: |
          echo "## ✅ Deploy successful" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Site:** https://theonlyfrogs.com" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployed:** $(date -u)" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          MESSAGE="✅ **Neocities Deploy Successful!**

          Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"

  # --------------------------------
  # FAILURE NOTIFICATIONS
  # --------------------------------

  notify-on-failure:
    name: Notify on Failure
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ failure() }}

    steps:
      - name: Send failure email
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL_USER }}
          password: ${{ secrets.NOTIFY_EMAIL_PASS }}
          subject: "🚨 Neocities Deploy Failed!"
          to: "violet@theonlyfrogs.com"
          from: "Neocities Bot <violet@theonlyfrogs.com>"
          body: |
            ❌ The Neocities deploy workflow failed.

            Repository: ${{ github.repository }}
            Workflow: ${{ github.workflow }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          MESSAGE="🚨 **Neocities Deploy Failed!**

          Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK"